# 复制为 backend/config.toml；真实配置和备份不能提交或分享。
# 旧安装使用 npm run config:migrate -- --check / --apply 转换，勿生成替代密钥。

[storage]
# 相对路径以仓库根目录为准；正式数据与开发数据必须隔离。
database_path = ".runtime/future-props.db"

[security]
# 仅新安装生成 Fernet 密钥；已有数据必须保留原始密钥。
secrets_key = "replace-with-a-valid-fernet-key"

[http]
cors_origins = ["http://127.0.0.1:3000", "http://localhost:3000"]
# 本机使用 HTTP；受控公网入口为 HTTPS 响应追加 Secure Cookie。
auth_cookie_secure = false

[website]
port = 9000
web_root = ".local/studio-release"
public_enabled = false
# 迁移工具写入原桌面数据根，服务持锁防止旧客户端误启动。
legacy_data_root = ""

# 公网连接资料；自动启动由 website.public_enabled 控制。
[remote_web]
# 兼容旧配置字段，自动启动由 website.public_enabled 控制。
enabled = false
origin = ""
port = 28081
# 使用正式构建，不能指向 Vite。
web_root = ""
ssh_host = ""
ssh_port = 22
ssh_user = ""
remote_port = 28080
# 已导入的专用凭据标识；不填写私钥正文或管理员密码。
identity_id = ""
known_hosts_id = ""

[limits]
visual_asset_max_bytes = 209715200
galgame_export_max_bytes = 8589934592
project_snapshot_max_bytes = 8589934592
project_snapshot_max_files = 10000
skill_archive_max_bytes = 20971520
skill_expanded_max_bytes = 52428800
skill_max_files = 500

[integrations]
# 留空不外传参考媒体；配置时只接受无凭证 HTTPS URL。
temp_media_upload_url = ""
# 绝对可执行文件路径数组；默认禁用 stdio。
mcp_stdio_allowed_commands = []

[interview_codex]
# macOS 本机 Codex 资料准备；默认关闭，只能由绑定账号发起。
enabled = false
# 留空自动发现已安装的 Codex CLI；需要 0.163 或更新版本。
executable = ""
# 当前部署中获准使用本机 Codex 身份的 FPL 账号 ID。
user_id = ""

[visual_acceptance]
# 验收连接只由部署配置指定；界面不提供修改入口。模型必须属于明确指定的账号。
model_owner_user_id = ""
model_id = ""
# 本机 CLI 已安装并登录后，填入绝对路径和获准使用该本机身份的账号 ID。
# 空路径或空账号列表表示不可用；不会自动安装、登录或回退到其他连接。
codex_executable = ""
codex_user_ids = []
claude_executable = ""
claude_user_ids = []

# Shared local CLI connections. Login with the CLI outside FPL; grant usage in Code Agents.
[code_agents]
codex_enabled = false
codex_executable = ""
claude_enabled = false
claude_executable = ""
opencode_enabled = false
opencode_executable = ""
dsh_enabled = false
dsh_executable = ""
pi_enabled = false
pi_executable = ""

[agent_workbench]
# 只读历史与同步独立于 CLI 执行开关；只有当前账号明确绑定来源后才采集。
enabled = true
poll_seconds = 1
files_per_pass = 100
