<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <title>Future Props Lab</title>
    <link rel="stylesheet" href="startup.css" />
  </head>
  <body data-phase="starting">
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__glow atmosphere__glow--a"></div>
      <div class="atmosphere__glow atmosphere__glow--b"></div>
      <div class="atmosphere__grid"></div>
      <div class="atmosphere__motes"></div>
    </div>
    <main class="panel">
      <div class="mark" aria-hidden="true">
        <span class="mark__ring"></span>
        <span class="mark__ring mark__ring--slow"></span>
        <img
          class="mark__image"
          src="brand-mark.png"
          width="128"
          height="128"
          alt=""
          draggable="false"
        />
      </div>
      <p class="eyebrow">FUTURE PROPS LAB · DESKTOP</p>
      <h1>未来道具研究所</h1>
      <p id="message" class="status" role="status">正在启动本地研究所…</p>
      <div id="progress" class="progress" aria-hidden="true">
        <span class="progress__bar"></span>
      </div>
      <div class="actions">
        <button id="retry" type="button" hidden>重新启动</button>
        <button id="logs" class="secondary" type="button">打开日志目录</button>
      </div>
      <p class="footnote">账号与作品保存在本机，升级应用不会替换你的数据。</p>
    </main>
    <script src="startup.js"></script>
  </body>
</html>
