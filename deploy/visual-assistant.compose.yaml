# Grant the Visual worker a settlement-only peer channel into Models.
x-visual-assistant-settlement-key: &visual-assistant-settlement-key
  type: bind
  source: ${FPL_VISUAL_ASSISTANT_SETTLEMENT_KEY:?Select a protected assistant settlement key}
  target: /run/fpl/visual-assistant-settlement-key
  read_only: true
  bind:
    create_host_path: false

services:
  visual:
    volumes:
      - <<: *visual-assistant-settlement-key
  models:
    volumes:
      - <<: *visual-assistant-settlement-key
