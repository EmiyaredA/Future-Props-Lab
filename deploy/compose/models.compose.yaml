# Selected with deploy/compose/compose.yaml only when an independent Models release is configured.
services:
  models:
    cap_drop:
    - ALL
    cpus: 2
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready',
        timeout=2)
      timeout: 3s
    image: ${FPL_MODELS_IMAGE:?Build and select a Models release}
    init: true
    mem_limit: 1536m
    networks:
    - private
    - egress
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 60s
    tmpfs:
    - /tmp:mode=1777,size=32m
    user: ${FPL_SERVICE_UID}:${FPL_SERVICE_GID}
    volumes:
    - bind:
        create_host_path: false
      source: ${FPL_MODELS_STATE:?Select isolated or formally migrated Models data}
      target: /state
      type: bind
    - bind:
        create_host_path: false
      read_only: true
      source: ${FPL_MODELS_CONFIG:?Select minimal read-only Models TOML}
      target: /run/fpl/config.toml
      type: bind
    - bind:
        create_host_path: false
      read_only: true
      source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
      target: /run/fpl/identity-public.pem
      type: bind
    - bind:
        create_host_path: false
      read_only: true
      source: ${FPL_MODELS_IDENTITY_CLIENT:?Select protected Models connection}
      target: /run/fpl/identity-client.json
      type: bind
    - type: bind
      source: ${FPL_MODELS_NATIVE_INGRESS:?Select Models native ingress proof}
      target: /run/fpl/native-ingress
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${FPL_MODELS_WORKERS:?Select Models native worker credentials}
      target: /run/fpl/workers.json
      read_only: true
      bind:
        create_host_path: false
networks:
  egress:
    driver: bridge
