# Enable Visual readiness and a settlement-only peer channel into Models.
x-visual-assistant-settlement-key: &visual-assistant-settlement-key
  type: bind
  source: ${FPL_VISUAL_ASSISTANT_SETTLEMENT_KEY:?Select a protected assistant settlement key}
  target: /run/fpl/visual-assistant-settlement-key
  read_only: true
  bind:
    create_host_path: false

services:
  visual:
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - <<: *visual-assistant-settlement-key
  models:
    volumes:
      - <<: *visual-assistant-settlement-key
