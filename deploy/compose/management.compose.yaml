# Overlay used together with deploy/compose/compose.yaml. All state/config selections are explicit.
services:
  identity:
    volumes:
      - type: bind
        source: ${FPL_MANAGEMENT_GATEWAY_TOKEN:?Select the independent management gateway token}
        target: /run/fpl/management-gateway-token
        read_only: true
        bind:
          create_host_path: false

  management:
    image: ${FPL_MANAGEMENT_IMAGE:?Build and select a Management release}
    user: "${FPL_SERVICE_UID:?Set service UID}:${FPL_SERVICE_GID:?Set service GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    cpus: 0.5
    mem_limit: 512m
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    tmpfs:
      - /tmp:mode=1777,size=64m
    ports:
      - "127.0.0.1:${FPL_MANAGEMENT_LOCAL_PORT:-9002}:9000"
      - "127.0.0.1:${FPL_MANAGEMENT_PUBLIC_PORT:-28083}:28081"
      - "127.0.0.1:${FPL_MANAGEMENT_NATIVE_PORT:-29092}:29090"
    volumes:
      - type: bind
        source: ${FPL_MANAGEMENT_STATE:?Select independent Management data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_MANAGEMENT_CONFIG:?Select minimal Management TOML}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_MANAGEMENT_CADDYFILE:?Select the management-only routing configuration}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_MANAGEMENT_IDENTITY_TOKEN:?Select Management Identity credential}
        target: /run/fpl/identity-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_MANAGEMENT_NATIVE_INGRESS:?Select the dedicated native ingress proof}
        target: /run/fpl/native-ingress
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_MANAGEMENT_WORKERS:?Select management worker credentials}
        target: /run/fpl/workers.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [private, ingress]
