# Isolated Agent Runtime. Native CLI execution uses the separate Mac worker.
services:
  agent-runtime:
    image: ${FPL_AGENT_RUNTIME_IMAGE:?Build and select a Agent Runtime release}
    command: [serve, --native-config, /run/fpl/native.json]
    user: "${FPL_SERVICE_UID}:${FPL_SERVICE_GID}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 45s
    tmpfs:
      - /tmp:mode=1777,size=32m
    volumes:
      - type: bind
        source: ${FPL_AGENT_RUNTIME_STATE:?Select isolated Agent Runtime state}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_AGENT_RUNTIME_NATIVE_CONFIG:?Select private native credentials}
        target: /run/fpl/native.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [private]
