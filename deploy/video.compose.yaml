# Isolated Video Editor application. Production readiness requires full API and migration.
services:
  assets:
    volumes:
      - type: bind
        source: ${FPL_VIDEO_ORIGINALS_KEY:?Select the protected Rendering Assets key}
        target: /run/fpl/video-originals-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_VIDEO_ARCHIVE_KEY:?Select the protected Video Assets archive key}
        target: /run/fpl/video-archive-key
        read_only: true
        bind:
          create_host_path: false
  rendering:
    volumes:
      - type: bind
        source: ${FPL_VIDEO_ORIGINALS_KEY:?Select the protected Rendering Assets key}
        target: /run/fpl/video-originals-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_VIDEO_MEDIA_KEY:?Select the protected Video Rendering key}
        target: /run/fpl/video-media-key
        read_only: true
        bind:
          create_host_path: false
  video:
    image: ${FPL_VIDEO_IMAGE:?Build and select a Video Editor release}
    user: "${FPL_SERVICE_UID}:${FPL_SERVICE_GID}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 45s
    tmpfs:
      - /tmp:mode=1777,size=32m
    volumes:
      - type: bind
        source: ${FPL_VIDEO_STATE:?Select isolated Video Editor state}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_VIDEO_IDENTITY_TOKEN:?Select the Video Editor Identity credential}
        target: /run/fpl/identity-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_VIDEO_MEDIA_KEY:?Select the protected Video Rendering key}
        target: /run/fpl/video-media-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_VIDEO_ARCHIVE_KEY:?Select the protected Video Assets archive key}
        target: /run/fpl/video-archive-key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [private]
