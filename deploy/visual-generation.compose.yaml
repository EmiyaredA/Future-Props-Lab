# Supply the private Visual-to-Models decision and result credential.
x-visual-generation-key: &visual-generation-key
  type: bind
  source: ${FPL_VISUAL_GENERATION_KEY:?Select a protected Visual-to-Models generation key}
  target: /run/fpl/visual-generation-key
  read_only: true
  bind:
    create_host_path: false

services:
  visual:
    volumes:
      - <<: *visual-generation-key
  models:
    volumes:
      - <<: *visual-generation-key
