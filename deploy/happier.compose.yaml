# Dedicated local relay and CLI runner. Public traffic must use the FPL ingress.
services:
  relay:
    image: ${FPL_HAPPIER_RELAY_IMAGE:-fpl/happier-e2ee:2aeb139d}
    ports:
      - "127.0.0.1:${FPL_HAPPIER_RELAY_PORT:-3005}:3005"
    environment:
      HAPPIER_PUBLIC_SERVER_URL: ${FPL_HAPPIER_ORIGIN:?Set the canonical HTTPS Happier origin}
      HAPPIER_WEBAPP_URL: ${FPL_HAPPIER_ORIGIN:?Set the canonical HTTPS Happier origin}
      AUTH_ANONYMOUS_SIGNUP_ENABLED: ${FPL_HAPPIER_BOOTSTRAP_SIGNUP:-false}
      HAPPIER_FEATURE_ENCRYPTION__STORAGE_POLICY: required_e2ee
      HAPPIER_FEATURE_E2EE__KEYLESS_ACCOUNTS_ENABLED: "0"
    volumes:
      - relay-e2ee-data:/data

  runner:
    image: ${FPL_HAPPIER_RUNNER_IMAGE:-fpl/happier-runner-e2ee:2aeb139d}
    user: "1000:1000"
    command: ["happier", "daemon", "start-sync"]
    working_dir: /projects/workspace
    environment:
      HOME: /runner
      HAPPIER_HOME_DIR: /runner/.happier
      HAPPIER_SERVER_URL: http://relay:3005
      HAPPIER_PUBLIC_SERVER_URL: ${FPL_HAPPIER_ORIGIN:?Set the canonical HTTPS Happier origin}
      HAPPIER_WEBAPP_URL: ${FPL_HAPPIER_ORIGIN:?Set the canonical HTTPS Happier origin}
      HAPPIER_NO_BROWSER_OPEN: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - runner-e2ee-home:/runner
      - type: bind
        source: ${FPL_HAPPIER_PROJECT_ROOT:?Set the absolute authorized project directory}
        target: /projects/workspace
        bind:
          create_host_path: false

volumes:
  relay-e2ee-data:
  runner-e2ee-home:
