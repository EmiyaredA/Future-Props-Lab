name: future-props-lab

services:
  identity:
    image: ${FPL_IDENTITY_IMAGE:?Build and select an Identity release}
    user: "${FPL_SERVICE_UID:?Set the data owner UID}:${FPL_SERVICE_GID:?Set the data owner GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    cpus: 1
    mem_limit: 512m
    tmpfs:
      - /tmp:mode=1777,size=64m
    volumes:
      - type: bind
        source: ${FPL_IDENTITY_STATE:?Select isolated or formally migrated Identity data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_CONFIG:?Select the minimal read-only Identity TOML}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_SIGNING_KEY:?Select the Identity signing key}
        target: /run/fpl/identity-signing.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_GATEWAY_TOKEN:?Select the private gateway credential file}
        target: /run/fpl/gateway-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_SERVICE_CREDENTIALS:?Select private per-service credentials}
        target: /run/fpl/service-credentials.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [private]

  agents:
    image: ${FPL_AGENTS_IMAGE:?Build and select an Agents release}
    user: "${FPL_SERVICE_UID:?Set the data owner UID}:${FPL_SERVICE_GID:?Set the data owner GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    cpus: 1
    mem_limit: 512m
    tmpfs:
      - /tmp:mode=1777,size=64m
    volumes:
      - type: bind
        source: ${FPL_AGENTS_STATE:?Select isolated or formally migrated Agents data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_AGENTS_CONFIG:?Select the minimal read-only Agents TOML}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_AGENTS_IDENTITY_TOKEN:?Select Agents service credential}
        target: /run/fpl/identity-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_AGENTS_NATIVE_INGRESS:?Select native lane proof}
        target: /run/fpl/native-ingress
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_AGENTS_WORKERS:?Select collector worker credentials}
        target: /run/fpl/workers.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [private]

  assets:
    image: ${FPL_ASSETS_IMAGE:?Build and select an Assets release}
    user: ${FPL_SERVICE_UID}:${FPL_SERVICE_GID}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    cpus: 1
    mem_limit: 512m
    tmpfs:
      - /tmp:mode=1777,size=32m
    volumes:
      - type: bind
        source: ${FPL_ASSETS_STATE:?Select isolated or formally migrated Assets data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_ASSETS_CONFIG:?Select minimal read-only Assets TOML}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_ASSETS_IDENTITY_CLIENT:?Select protected Assets connection}
        target: /run/fpl/identity-client.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - private

  portal:
    image: ${FPL_PORTAL_IMAGE:?Build and select a Portal release}
    user: "${FPL_SERVICE_UID}:${FPL_SERVICE_GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    cpus: 0.5
    mem_limit: 256m
    tmpfs:
      - /tmp:mode=1777,size=32m
    volumes:
      - type: bind
        source: ${FPL_PORTAL_STATE:?Select isolated or formally migrated Portal data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_PORTAL_CONFIG:?Select minimal read-only Portal TOML}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [private]

  gateway:
    image: ${FPL_GATEWAY_IMAGE:?Build and select a Gateway release}
    user: "${FPL_SERVICE_UID}:${FPL_SERVICE_GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    tmpfs:
      - /tmp:mode=1777,size=32m
    ports:
      - "127.0.0.1:${FPL_LOCAL_PORT:-9000}:9000"
      - "127.0.0.1:${FPL_PUBLIC_PORT:-28081}:28081"
      - "127.0.0.1:${FPL_NATIVE_PORT:-29090}:29090"
    volumes:
      - type: bind
        source: ${FPL_GATEWAY_CONFIG:?Select the private generated gateway routing file}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_GATEWAY_STATE:?Select Gateway data}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_GATEWAY_SETTINGS:?Select minimal Gateway settings}
        target: /run/fpl/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_IDENTITY_PUBLIC_KEY:?Select Identity public key}
        target: /run/fpl/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_GATEWAY_IDENTITY_TOKEN:?Select Gateway service credential}
        target: /run/fpl/identity-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FPL_GATEWAY_PUBLISHERS:?Select application event publisher credentials}
        target: /run/fpl/publishers.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      identity:
        condition: service_healthy
    networks: [private, ingress]

networks:
  private:
    internal: true
  ingress:
    driver: bridge
