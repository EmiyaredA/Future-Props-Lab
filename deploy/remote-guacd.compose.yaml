# Guacamole transport is private and uses an explicitly staged Mac-compatible image.
services:
  guacd:
    image: ${FPL_GUACD_IMAGE:?Select the pinned Mac-compatible Guacamole image}
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 20s
    tmpfs:
      - /tmp:mode=1777,size=32m
    networks: [private, remote-display]

networks:
  remote-display:
    driver: bridge
