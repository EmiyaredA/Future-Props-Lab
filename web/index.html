<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f1" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <title>未来道具研究所 · Future Props Lab</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("future_props_theme") === "dark"
            ? "dark"
            : "light";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/src/shared/ui/loading-scene.css" />
    <link rel="stylesheet" href="/src/shared/ui/loading-state.css" />
    <style>
      html {
        background: #fffcf8;
      }
      html[data-theme="dark"] {
        background: #202329;
      }
      .fpl-boot-loading {
        font: 14px system-ui;
      }
      .fpl-boot-loading > span {
        animation: fpl-boot-reveal 0.15s step-end;
      }
      html[data-theme="dark"] .fpl-boot-loading {
        color: #c0b8ab;
      }
      @keyframes fpl-boot-reveal {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-live="polite"
        aria-busy="true"
        class="fpl-loading fpl-loading--page fpl-loading--fullscreen is-visible fpl-boot-loading"
      >
        <span
          class="fpl-loading-scene fpl-loading-scene--page"
          aria-hidden="true"
          data-paused="true"
        >
          <span class="fpl-loading-halo"></span>
          <span class="fpl-loading-radar"></span>
          <svg class="fpl-loading-dial" viewBox="0 0 320 320" fill="none">
            <use
              class="fpl-dial-base"
              href="/brand/loading/loading-dial.svg#base"
            ></use>
            <g class="fpl-dial-sweep">
              <use href="/brand/loading/loading-dial.svg#sweep"></use>
            </g>
            <g class="fpl-dial-tracers">
              <use href="/brand/loading/loading-dial.svg#tracers"></use>
            </g>
            <g class="fpl-dial-comet">
              <use href="/brand/loading/loading-dial.svg#comet"></use>
            </g>
            <g class="fpl-dial-energy">
              <use href="/brand/loading/loading-dial.svg#energy"></use>
            </g>
            <g class="fpl-dial-particles">
              <use href="/brand/loading/loading-dial.svg#particles"></use>
            </g>
            <use
              class="fpl-dial-scan"
              href="/brand/loading/loading-dial.svg#scan"
            ></use>
            <use
              class="fpl-dial-speed"
              href="/brand/loading/loading-dial.svg#speed"
            ></use>
          </svg>
          <span class="fpl-scene-runner"
            ><span class="fpl-loading-character" data-playing="false">
              <picture
                ><source
                  data-srcset="/brand/loading/kurisu-run.webp"
                  type="image/webp"
                />
                <img
                  data-src="/brand/loading/kurisu-run.png"
                  alt=""
                  width="150"
                  height="192"
                /> </picture
              ><video
                data-src="/brand/loading/kurisu-run.webm"
                data-poster="/brand/loading/kurisu-run.webp"
                muted
                loop
                playsinline
                preload="auto"
                width="150"
                height="192"
              ></video> </span
          ></span>
          <span class="fpl-scene-prop fpl-scene-prop--phonewave"
            ><img
              data-src="/brand/loading/phonewave.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--pocket-watch"
            ><img
              data-src="/brand/loading/pocket-watch.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--metal-upa"
            ><img
              data-src="/brand/loading/metal-upa.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--divergence-meter"
            ><img
              data-src="/brand/loading/divergence-meter.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--flip-phone"
            ><img
              data-src="/brand/loading/flip-phone.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--gel-banana"
            ><img
              data-src="/brand/loading/gel-banana.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--dr-pepper"
            ><img
              data-src="/brand/loading/dr-pepper.webp"
              alt=""
              width="256"
              height="256"
          /></span>
          <span class="fpl-scene-prop fpl-scene-prop--time-machine"
            ><img
              data-src="/brand/loading/time-machine.webp"
              alt=""
              width="256"
              height="256"
          /></span>
        </span>
        <span class="fpl-loading-copy"
          ><span class="fpl-loading-label">正在打开 Future Props Lab…</span
          ><span class="fpl-progress fpl-loading-dots" aria-hidden="true"
            ><span></span></span
        ></span>
      </div>
    </div>
    <script type="module" src="/src/app/bootstrap.ts"></script>
  </body>
</html>
