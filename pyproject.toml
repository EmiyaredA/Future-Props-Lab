[project]
name = "future-props-lab-backend"
version = "0.1.0"
description = "Future Props Lab model infrastructure API"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pillow>=12.3.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.1.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend", "."]
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "db", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "db"]
