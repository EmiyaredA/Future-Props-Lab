[project]
name = "future-props-lab-backend"
version = "0.1.0"
description = "Future Props Lab model infrastructure API"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21.0",
  "argon2-cffi>=25.1.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jsonschema>=4.25.0",
  "mcp>=2.0.0,<3.0.0",
  "pillow>=12.3.0",
  "pypdf>=6.0.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.1.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "tinytag>=2.1.0",
  "uvicorn[standard]>=0.35.0",
  "websockets>=15.0",
  "python-pptx>=1.0.2,<2",
  "resvg-py>=0.3,<1",
  "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["real_auth: run against the real Cookie/API-key authentication boundary"]
pythonpath = ["backend", "."]
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "db", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["B008"]

# Preserve the exact registered SQL text; formatting is not a schema migration.
[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/r0054_platform_runtime.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "db"]
