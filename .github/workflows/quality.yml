name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Pull backend runtime assets
        run: git lfs pull --include="backend/app/capabilities/media_rendering/assets/*.ttf,web/public/brand/amadeus/*" --exclude=""
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check backend db scripts tests sdk/python/src
      - run: uv run ruff format --check backend db scripts tests sdk/python/src
      - run: uv build sdk/python
      - run: uv venv /tmp/fpl-sdk-check && uv pip install --python /tmp/fpl-sdk-check/bin/python sdk/python/dist/future_props_lab_sdk-*.whl
      - run: cd /tmp && /tmp/fpl-sdk-check/bin/python "$GITHUB_WORKSPACE/scripts/check_sdk_install.py"
      - run: uv run pytest -q
        env:
          FPL_SECRETS_KEY: Q3kT62dvbHHXXulO5XPCR84_yXK6t-6LXz7BcIYONys=

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Pull Web runtime assets
        run: git lfs pull --include="web/public/presentation-templates/*,web/public/voice-vad/*,web/public/brand/thought-workshop-mark.png,web/public/brand/presentation-workshop-mark.png,web/public/brand/interview-assistant-mark.png" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: npm ci
      - run: npm run verify-notes
      - run: npm run check-docs-center-protected
        env:
          DOCS_CENTER_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm run contracts:check
        env:
          FPL_SECRETS_KEY: Q3kT62dvbHHXXulO5XPCR84_yXK6t-6LXz7BcIYONys=
      - run: npm run lint --workspace web
      - run: npm run format:check --workspace web
      - run: npm run test --workspace web
      - run: npm run build

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Pull E2E runtime assets
        run: git lfs pull --include="backend/app/capabilities/media_rendering/assets/*.ttf,web/public/presentation-templates/*,web/public/voice-vad/*,web/public/brand/thought-workshop-mark.png,web/public/brand/presentation-workshop-mark.png,web/public/brand/interview-assistant-mark.png" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        env:
          FPL_SECRETS_KEY: Q3kT62dvbHHXXulO5XPCR84_yXK6t-6LXz7BcIYONys=

  lfs-integrity:
    name: Git LFS pointer integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: git lfs install --local
      - run: python3 scripts/check_lfs_assets.py --pointers

  docker-isolation:
    name: Isolated services and independent Agents browser
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: npm ci
      - name: Prepare ignored acceptance logs
        run: |
          git check-ignore .local/service-split/ci-build.log .local/playwright-browsers
          mkdir -p .local/service-split
      - run: npx playwright install --with-deps chromium
      - name: Build the independent browser program
        run: npm run services:build:web -- agents > .local/service-split/ci-web-build.log
      - name: Build the independently owned images
        run: |
          uv run python scripts/website/service_build.py identity --build > .local/service-split/ci-build.log
          uv run python scripts/website/service_build.py gateway --build > .local/service-split/ci-gateway-build.log
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          program = json.loads(Path('.local/service-split/ci-web-build.log').read_text().splitlines()[-1])
          with Path('.local/service-split/ci-agents-build.log').open('w') as log:
              subprocess.run([
                  'uv', 'run', 'python', 'scripts/website/service_build.py', 'agents',
                  '--build', '--web-release', program['root'],
              ], stdout=log, check=True)
          PY
      - name: Verify container isolation, restore and real browser access
        run: |
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          def image(name):
              return json.loads(Path(name).read_text().splitlines()[-1])['image']
          identity = image('.local/service-split/ci-build.log')
          gateway = image('.local/service-split/ci-gateway-build.log')
          agents = image('.local/service-split/ci-agents-build.log')
          subprocess.run([
              'uv', 'run', 'python', 'scripts/website/service_docker_smoke.py',
              '--image', identity, '--gateway-image', gateway,
          ], check=True)
          subprocess.run([
              'uv', 'run', 'python', 'scripts/website/agents_docker_smoke.py',
              '--identity-image', identity, '--agents-image', agents,
              '--gateway-image', gateway, '--browser',
          ], check=True)
          PY
