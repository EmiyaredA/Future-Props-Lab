[project]
name = "future-props-lab-sdk"
version = "0.1.0"
description = "Typed Python automation client for Future Props Lab"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "websockets>=15,<16"]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/future_props_lab"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
